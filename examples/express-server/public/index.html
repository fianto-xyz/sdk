<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fianto Express example</title>
    <script src="/fianto-button.js"></script>
  </head>
  <body style="font-family: system-ui, sans-serif; max-width: 480px; margin: 10vh auto; text-align: center">
    <h1>fianto Express + plain HTML example</h1>
    <p>Buy a coffee with the Pay with fianto button — no bundler, no framework.</p>

    <fianto-button session-endpoint="/api/checkout" data-plan="pro" label="buy"></fianto-button>

    <p id="status" role="status"></p>

    <script>
      var button = document.querySelector('fianto-button');
      var status = document.getElementById('status');

      // Money safety — see @fianto/js's README ("The four statuses") before changing this
      // copy:
      //   - "succeeded" means the payer's browser saw checkout finish ON THE CHECKOUT PAGE.
      //     It is NOT proof of payment or settlement — only a verified `order.paid` webhook
      //     (see ../src/app.ts's onOrderPaid) or a server-side fianto.orders.retrieve(id) call
      //     proves that.
      //   - "canceled" does NOT mean nothing was charged either — a transaction the payer
      //     already built can still land on-chain after they clicked "cancel" on the checkout
      //     page. Never say "you have not been charged"; point them at their order instead.
      //   - "expired" similarly never says just "try again": check the order first.
      //   - "closed" means UNKNOWN, not "nothing was charged" — the popup closed without ever
      //     posting a result back. Never tell the payer nothing was charged on this status.
      var COPY = {
        succeeded: 'Almost done — we are confirming your payment. This page will not tell you when it settles.',
        canceled: 'Checkout canceled. If a payment went through anyway, check your order status before trying again.',
        expired: 'That checkout link expired. Check your order status before trying again.',
        closed:
          "We couldn't tell what happened. If you were charged, it will show up on your account shortly — please do not assume nothing happened.",
      };

      // event.detail.message is the checkout route's own message, written for the merchant (it
      // can name a misconfigured param, an internal detail, etc.) — never render it to the
      // payer. Show a short line keyed on event.detail.code instead, and log the real message.
      var ERROR_COPY = {
        payment_in_progress: 'A payment for this order is already in progress.',
        order_already_paid: 'This order has already been paid.',
        order_session_mismatch: 'This checkout is out of date. Please refresh and try again.',
        rate_limited: 'Checkout is busy right now. Please try again shortly.',
        checkout_unavailable: 'Checkout is busy right now. Please try again shortly.',
        session_not_reissuable: 'Checkout is busy right now. Please try again shortly.',
      };
      var GENERIC_ERROR_COPY = 'Checkout could not be started. Please try again.';

      button.addEventListener('fianto:result', function (event) {
        status.textContent = COPY[event.detail.status] || 'Unexpected status: ' + event.detail.status;
      });

      button.addEventListener('fianto:error', function (event) {
        console.error(event.detail.code, event.detail.message); // merchant-facing — never shown to the payer
        status.textContent = ERROR_COPY[event.detail.code] || GENERIC_ERROR_COPY;
      });
    </script>
  </body>
</html>
